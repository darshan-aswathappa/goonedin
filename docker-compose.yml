services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed via {$VAR} placeholders in the Caddyfile for resumedesk's
      # basic_auth gate - resume-bot has no auth of its own. Values live in
      # .env with `$` escaped as `$$` (bcrypt hashes contain literal `$`,
      # which docker compose would otherwise try to interpolate).
      - RESUMEDESK_AUTH_USER=${RESUMEDESK_AUTH_USER}
      - RESUMEDESK_AUTH_HASH=${RESUMEDESK_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Lets the Caddyfile reach host nginx on :8080, which fronts DassTracker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [frontend, backend, analytics, resumedesk]

  resumedesk:
    # Sibling checkout of xanf-code/resume-auto-generation-bot (separate repo,
    # separate lifecycle from goonedin) - kept outside this repo on purpose.
    build: ../resume-bot
    restart: unless-stopped
    env_file: ./.env.resumedesk
    volumes:
      - resumedesk_vault:/data/vault
      - resumedesk_tectonic_cache:/root/.cache/Tectonic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  resume-service:
    build: ./resume_service
    restart: unless-stopped
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - RESUME_SERVICE_URL=http://resume-service:8001
    shm_size: 1gb          # Chromium crashes with the 64MB default
    depends_on:
      resume-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.goonedin.xyz
        NEXT_PUBLIC_WS_URL: wss://api.goonedin.xyz/ws/jobs
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_API_URL: https://api.goonedin.xyz
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

volumes:
  caddy_data:
  caddy_config:
  resumedesk_vault:
  resumedesk_tectonic_cache:
