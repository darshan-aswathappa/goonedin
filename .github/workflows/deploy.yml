name: Deploy to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "analytics/**"
      - "resume_service/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/goonedin/goonedin
            git pull origin main
            # Build serially: the 4GB host OOMs when BuildKit runs the two
            # Next.js builds plus the Playwright install concurrently.
            docker compose build resume-service
            docker compose build backend
            docker compose build frontend
            docker compose build analytics
            docker compose up -d
            docker image prune -f
